<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Temple Run - Small</title>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<style>
*{margin:0;padding:0}body{overflow:hidden;background:#000;touch-action:none;font-family:Arial Black}
#score{position:absolute;top:10px;left:10px;z-index:10;color:#ff0;font-size:20px;text-shadow:2px 2px 4px #000}
#coins{position:absolute;top:10px;right:10px;z-index:10;color:#fff;font-size:18px}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;color:#fff;font-size:24px;text-align:center;display:none;background:rgba(0,0,0,.8);padding:20px;border-radius:15px}
.btn{position:absolute;bottom:20px;width:80px;height:80px;background:rgba(255,255,255,.2);border:2px solid #fff;border-radius:50%;z-index:10;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px}
#left{left:10px}#right{right:10px}#jump{left:50%;transform:translateX(-50%);bottom:20px;width:90px;height:60px;border-radius:20px;background:rgba(255,255,0,.3)}
</style>
</head>
<body>
<div id="score">0</div><div id="coins">🪙 0</div>
<div id="msg"></div>
<div id="left" class="btn">◀</div><div id="right" class="btn">▶</div><div id="jump" class="btn">JUMP</div>
<script>
let scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.Fog(0x87ceeb,20,80);
let camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
let renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.8));
let sun=new THREE.DirectionalLight(0xffffff,0.6);sun.position.set(10,20,10);scene.add(sun);

// Path
let pathGroup=new THREE.Group();scene.add(pathGroup);
let pathMat=new THREE.MeshLambertMaterial({color:0x8b5a2b});
for(let i=0;i<30;i++){let p=new THREE.Mesh(new THREE.BoxGeometry(12,1,10),pathMat);p.position.set(0,-0.5,-i*10);pathGroup.add(p);}

// Player
let player=new THREE.Group();scene.add(player);
let body=new THREE.Mesh(new THREE.CapsuleGeometry(0.4,0.8,4,8),new THREE.MeshLambertMaterial({color:0xffcc00}));body.position.y=1;player.add(body);
let head=new THREE.Mesh(new THREE.SphereGeometry(0.35,8,8),new THREE.MeshLambertMaterial({color:0xffd8b0}));head.position.y=1.9;player.add(head);
player.position.set(0,0,5);

let lane=1; // 0 left, 1 center, 2 right
let lanes=[-3,0,3];
let targetX=0, isJump=false, isSlide=false, jumpY=0,
