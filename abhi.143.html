<!DOCTYPE html>
<<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Temple Run 2D</title>
<style>
*{margin:0;padding:0}body{overflow:hidden;background:#87ceeb;touch-action:none;font-family:Arial Black}
canvas{display:block}
#score{position:absolute;top:8px;left:10px;color:#ff0;font-size:22px;text-shadow:2px 2px 0 #000}
#coins{position:absolute;top:8px;right:10px;color:#fff;font-size:18px}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);color:#fff;padding:20px 30px;border-radius:15px;font-size:22px;text-align:center;display:none;z-index:10}
.btn{position:absolute;bottom:15px;width:80px;height:80px;background:rgba(0,0,0,.3);border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;z-index:10}
#left{left:10px}#right{right:10px}#jump{left:50%;transform:translateX(-50%);width:100px;height:65px;border-radius:18px;background:rgba(255,204,0,.5);font-size:18px}
</style>
</head>
<body>
<div id="score">0</div><div id="coins">🪙 0</div>
<div id="msg">GAME OVER<br><span id="final"></span><br><br>TAP TO RESTART</div>
<div id="left" class="btn">◀</div><div id="right" class="btn">▶</div><div id="jump" class="btn">JUMP</div>
<canvas id="c"></canvas>
<script>
let canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
canvas.width=innerWidth;canvas.height=innerHeight;
let W=canvas.width,H=canvas.height;
let laneW=W/3, lanes=[W/2-laneW,W/2,W/2+laneW];
let lane=1, targetX=lanes[1], x=lanes[1], y=H-130;
let isJump=false,jumpY=0,vel=0;
let score=0,coinScore=0,speed=6;
let obstacles=[],coins=[],particles=[];
let gameOver=false;

function spawn(){
 if(Math.random()<0.025){
  let l=Math.floor(Math.random()*3);
  obstacles.push({lane:l,x:lanes[l],y:-60,w:50,h:50,type:Math.random()<0.5?'rock':'tree'});
 }
 if(Math.random()<0.06){
  let l=Math.floor(Math.random()*3);
  coins.push({lane:l,x:lanes[l],y:-30,r:18,taken:false});
 }
}

function drawRoad(){
 // sky
 ctx.fillStyle='#87ceeb';ctx.fillRect(0,0,W,H);
 // road perspective
 ctx.fillStyle='#8b5a2b';ctx.beginPath();ctx.moveTo(W*0.15,H);ctx.lineTo(W*0.35,0);ctx.lineTo(W*0.65,0);ctx.lineTo(W*0.85,H);ctx.closePath();ctx.fill();
 // lane lines
 ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;ctx.setLineDash([20,20]);
 ctx.beginPath();ctx.moveTo(W*0.35 + (W*0.15-W*0.35)*(H-0)/H,0);ctx.lineTo(W*0.15+laneW*0.3,H);ctx.stroke();
 ctx.beginPath();ctx.moveTo(W*0.65 + (W*0.85-W*0.65)*(0)/1,0);ctx.lineTo(W*0.85-laneW*0.3,H);ctx.stroke();
 ctx.setLineDash([]);
 // side grass
 ctx.fillStyle='#3d8a2a';ctx.fillRect(0,0,W*0.15,H);ctx.fillRect(W*0.85,0,W*0.15,H);
}

function drawPlayer(){
 let drawX=x,drawY=y-jumpY;
 // shadow
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(drawX,y+25,20,6,0,0,Math.PI*2);ctx.fill();
 // body yellow
 ctx.fillStyle='#ffcc00';ctx.fillRect(drawX-14,drawY-40,28,32);
 // head
 ctx.fillStyle='#ffd8b0';ctx.beginPath();ctx.arc(drawX,drawY-50,18,0,Math.PI*2);ctx.fill();
 // legs blue
 ctx.fillStyle='#1a3cff';ctx.fillRect(drawX-12,drawY-8,10,20);ctx.fillRect(drawX+2,drawY-8,10,20);
 if(isJump){ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.fillText('JUMP!',drawX-20,drawY-80);}
}

function loop(){
 if(gameOver)return;
 requestAnimationFrame(loop);
 drawRoad();
 x+=(targetX-x)*0.2;
 
 if(isJump){jumpY+=vel;vel-=1.2;y;if(jumpY<0){jumpY=0;isJump=false;vel=0;} else vel-=0.05; if(jumpY>0) vel-=0.8;}
 
 spawn();
 
 // obstacles
 for(let i=obstacles.length-1;i>=0;i--){
  let ob=obstacles[i];ob.y+=speed;
  let scale=0.3+ob.y/H*0.7;
  let w=ob.w*scale,h=ob.h*scale;
  let drawX=ob.x+(W/2-ob.x)*(ob.y/H)*0.5;
  if(ob.type=='rock'){ctx.fillStyle='#555';ctx.fillRect(drawX-w/2,ob.y-h,w,h);ctx.fillStyle='#777';ctx.fillRect(drawX-w/2+5,ob.y-h+5,w-10,8);}
  else{ctx.fillStyle='#4a2a0a';ctx.fillRect(drawX-6,ob.y-h,12,h);ctx.fillStyle='#0a5a0a';ctx.beginPath();ctx.arc(drawX,ob.y-h,18*scale,0,Math.PI*2);ctx.fill();}
  
  if(ob.y>H+50){obstacles.splice(i,1);continue;}
  if(!isJump && Math.abs(ob.y-y)<30 && Math.abs(drawX-x)<28){gameOver=true;document.getElementById('final').innerText='Score '+Math.floor(score);document.getElementById('msg').style.display='block';}
 }
 
 // coins
 for(let i=coins.length-1;i>=0;i--){
  let c=coins[i];c.y+=speed;
  let scale=0.4+c.y/H*0.6;
  let drawX=c.x+(W/2-c.x)*(c.y/H)*0.5;
  ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(drawX,c.y,c.r*scale,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(drawX,c.y,c.r*scale*0.6,0,Math.PI*2);ctx.fill();
  if(c.y>H+30){coins.splice(i,1);continue;}
  if(Math.abs(c.y-y)<35 && Math.abs(drawX-x)<30){coins.splice(i,1);coinScore++;document.getElementById('coins').innerText='🪙 '+coinScore;score+=20;}
 }
 
 drawPlayer();
 score+=0.2;speed+=0.002;
 document.getElementById('score').innerText=Math.floor(score);
}

function moveLane(dir){
 if(gameOver)return;
 lane+=dir;if(lane<0)lane=0;if(lane>2)lane=2;targetX=lanes[lane];
}
function jump(){if(!isJump && !gameOver){isJump=true;vel=18;jumpY=0;}}

document.getElementById('left').onclick=()=>moveLane(-1);
document.getElementById('right').onclick=()=>moveLane(1);
document.getElementById('jump').onclick=jump;
let sx=0;addEventListener('touchstart',e=>sx=e.touches[0].clientX);
addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>35){moveLane(dx<0?-1:1);}else jump();});
document.getElementById('msg').onclick=()=>location.reload();
addEventListener('resize',()=>{canvas.width=innerWidth;canvas.height=innerHeight;W=canvas.width;H=canvas.height;laneW=W/3;lanes=[W/2-laneW,W/2,W/2+laneW];targetX=lanes[lane];});
loop();
</script>
</body>
</html>
